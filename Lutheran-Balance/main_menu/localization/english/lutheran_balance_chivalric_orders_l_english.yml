l_english:
 order_of_the_luther_rose: "Order of the Luther Rose"
 order_of_the_luther_rose_desc: "Founded by the Italian crown after its break with Rome, the Order of the Luther Rose gathers the Lutheran nobility under the Reformer's own seal: a black cross within a red heart, set upon a white rose. Its knights swear to defend the Gospel and the evangelical congregations, and to stand by their brothers in every Lutheran land."
