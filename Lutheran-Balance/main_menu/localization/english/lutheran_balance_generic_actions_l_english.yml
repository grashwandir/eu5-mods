l_english:
 protestant_feed_the_poor: "$feed_the_poor$"
 protestant_feed_the_poor_desc: "Have a #high $protestant_almoners_calling$#! order open its almshouses to the destitute. Raises #high Peasantry#! satisfaction and stokes the order's [zeal|E]."
 protestant_feed_the_poor_no_orders: "@trigger_no! No [religious_orders|e] of the #high $protestant_almoners_calling$#! [calling|E] exist in this religion."
 choose_religious_order_for_protestant_feed_the_poor: "Choose a $protestant_almoners_calling$ order"

 protestant_preach_a_mission: "$preach_a_mission$"
 protestant_preach_a_mission_desc: "Send the preachers of a #high $protestant_preachers_calling$#! order to preach among the unconverted of one of our [locations|e]. Stokes the order's [zeal|E]."
 protestant_preach_a_mission_no_orders: "@trigger_no! No [religious_orders|e] of the #high $protestant_preachers_calling$#! [calling|E] exist in this religion."
 choose_religious_order_for_protestant_preach_a_mission: "Choose a $protestant_preachers_calling$ order"

 protestant_absolve_the_court: "$absolve_the_court$"
 protestant_absolve_the_court_desc: "Have a #high $protestant_confessors_calling$#! order shrive our court and proclaim the dynasty's sins forgiven. Stokes the order's [zeal|E]."
 protestant_absolve_the_court_no_orders: "@trigger_no! No [religious_orders|e] of the #high $protestant_confessors_calling$#! [calling|E] exist in this religion."
 choose_religious_order_for_protestant_absolve_the_court: "Choose a $protestant_confessors_calling$ order"

 protestant_pray_for_the_realm: "$pray_for_the_realm$"
 protestant_pray_for_the_realm_desc: "Have a #high $protestant_contemplatives_calling$#! order chant perpetual intercessions for the realm and its weary people. Stokes the order's [zeal|E]."
 protestant_pray_for_the_realm_no_orders: "@trigger_no! No [religious_orders|e] of the #high $protestant_contemplatives_calling$#! [calling|E] exist in this religion."
 choose_religious_order_for_protestant_pray_for_the_realm: "Choose a $protestant_contemplatives_calling$ order"

 protestant_open_the_scriptoria: "$open_the_scriptoria$"
 protestant_open_the_scriptoria_desc: "Have a #high $protestant_scholars_calling$#! order open its scriptoria and lend its masters to our schools. Stokes the order's [zeal|E]."
 protestant_open_the_scriptoria_no_orders: "@trigger_no! No [religious_orders|e] of the #high $protestant_scholars_calling$#! [calling|E] exist in this religion."
 choose_religious_order_for_protestant_open_the_scriptoria: "Choose a $protestant_scholars_calling$ order"

 protestant_break_new_ground: "$break_new_ground$"
 protestant_break_new_ground_desc: "Have a #high $protestant_cultivators_calling$#! order's lay brothers clear the wastes around one of their granges and put the land under the plow. Stokes the order's [zeal|E]."
 protestant_break_new_ground_no_orders: "@trigger_no! No [religious_orders|e] of the #high $protestant_cultivators_calling$#! [calling|E] hold any [holdings|E] in our lands."
 choose_religious_order_for_protestant_break_new_ground: "Choose a $protestant_cultivators_calling$ order"
