l_english:
 state_ministry_bureaucracy: "State Ministry"
 state_ministry_bureaucracy_desc: "A system of permanent ministries through which a Lutheran ruler, head of both state and church, governs the realm. The administrative colleges confirmed by the Swedish Instrument of Government of 1634 showed how such boards could bring finance, war, and justice under steady central direction. Well-maintained, a State Ministry binds the nobility to the service of the crown and draws power to the center; neglected, its demands weigh on every estate of the realm alike."
 MODIFIER_TYPE_NAME_state_ministry_bureaucracy_impact_modifier: "$state_ministry_bureaucracy$ Impact"
 MODIFIER_TYPE_DESC_state_ministry_bureaucracy_impact_modifier: "How much [ShowBureaucracyTypeName('state_ministry_bureaucracy')] [bureaucracy|e] affects the [country|e]."
 rural_councils_bureaucracy: "Rural Councils"
 rural_councils_bureaucracy_desc: "A network of village councils through which the crown reaches directly into the countryside. In Piedmont the rural #italic comunità#! shared out their own common lands, pastures, and harvests, until the intendants installed by Victor Amadeus II from 1696 and his great land survey, the #italic Perequazione#!, brought them under the scrutiny of the state. Well-supported, the councils keep the fields productive and the old rural order intact; neglected, they become one more burden the peasantry must carry."
 MODIFIER_TYPE_NAME_rural_councils_bureaucracy_impact_modifier: "$rural_councils_bureaucracy$ Impact"
 MODIFIER_TYPE_DESC_rural_councils_bureaucracy_impact_modifier: "How much [ShowBureaucracyTypeName('rural_councils_bureaucracy')] [bureaucracy|e] affects the [country|e]."
