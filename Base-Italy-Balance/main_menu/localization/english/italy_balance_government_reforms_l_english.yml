l_english:
 italian_merchant_republic: "Italian Merchant Republic"
 italian_merchant_republic_desc: "The great merchant houses of our city sit in its councils and choose the head of state from among their own number. Commerce is the lifeblood of the republic: our merchants trade across the Mediterranean and raise warehouses in foreign ports, while the councils show little appetite for absorbing new lands into the state."
 great_council_of_justice_reform: "Great Council of Justice"
 great_council_of_justice_reform_desc: "The scattered courts and seigneurial tribunals of Sardinia and Piedmont are brought under a single Great Council of Justice. It hears appeals from every corner of the realm and binds island and mainland alike to the same law, strengthening the hand of the government over local custom."
