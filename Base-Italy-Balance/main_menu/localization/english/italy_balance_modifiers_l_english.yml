 STATIC_MODIFIER_NAME_righteous_claims: "Righteous Claims"
 STATIC_MODIFIER_DESC_righteous_claims: "The world accepts our claims as rightful, and our past actions are quickly forgiven."
 STATIC_MODIFIER_NAME_italian_conquest_momentum: "Italian Conquest Momentum"
 STATIC_MODIFIER_DESC_italian_conquest_momentum: "Each Italian city that falls to us makes the next one easier to hold. Local elites hurry to make peace with their new masters, and our administrators bring the conquered lands into the realm with remarkable speed."
 STATIC_MODIFIER_NAME_glory_to_padua: "Glory to Padua"
 STATIC_MODIFIER_DESC_glory_to_padua: "Padua's fame as a city of learning, art and law strengthens our government at home and our standing among the courts of Italy."
