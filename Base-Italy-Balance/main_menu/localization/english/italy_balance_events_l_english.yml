l_english:
 italy_balance_pad.1.title: "At the Edge of the Lagoon"
 italy_balance_pad.1.entry: "$italy_balance_pad.1.title$"
 italy_balance_pad.1.desc: "With [ShowLocationName('treviso')] in our hands, our banners fly within sight of the lagoon. The Venetian holdings on the mainland are cut off from their hinterland, and the Doge knows it. Our envoys urge us to make [GetCountry('VEN').GetNameWithNoTooltip] an offer: sell us what remains of their lands around the lagoon, or face the consequences of refusing."
 italy_balance_pad.1.a: "Send the offer to the Doge."
 italy_balance_pad.1.a.tt: "[GetCountry('VEN').GetNameWithNoTooltip] must choose: sell us all its locations in the province of [ShowLocationName('venice')] for gold, or suffer a severe loss of stability."
 italy_balance_pad.2.title: "An Offer from [ibb_padua_buyer.GetName]"
 italy_balance_pad.2.desc: "Envoys from [ibb_padua_buyer.GetName] have arrived at the Doge's Palace. Now that [ShowLocationName('treviso')] has fallen to them, they offer to buy every one of our remaining lands in the province of [ShowLocationName('venice')], the city itself included. They promise a fortune in gold. If we refuse, our merchants fear the mainland roads will be closed to us, and the city is already restless."
 italy_balance_pad.2.a: "Take their gold and move the seat of government."
 italy_balance_pad.2.b: "Venice is not for sale!"
 italy_balance_pad.3.title: "The Lagoon Is Ours"
 italy_balance_pad.3.desc: "[GetCountry('VEN').GetNameWithNoTooltip] has accepted our offer. Our gold has bought what no army could take, and the banner of our city now flies over [ShowLocationName('venice')]. All of Italy watches our rise, and our captains are already looking south, across the Po."
 italy_balance_pad.3.a: "Onward!"
 italy_balance_pad.4.title: "The Doge Refuses"
 italy_balance_pad.4.desc: "[GetCountry('VEN').GetNameWithNoTooltip] has rejected our offer out of hand. Their envoys declared that Venice is not for sale. Yet the city pays dearly for its pride: unrest spreads through the lagoon, and the Doge's government is shaken."
 italy_balance_pad.4.a: "They will regret this."
 italy_balance_pad.5.title: "Our Banners over Ferrara"
 italy_balance_pad.5.entry: "$italy_balance_pad.5.title$"
 italy_balance_pad.5.desc: "Our troops have entered [ShowLocationName('ferrara')]. Across Italy, our envoys argue that [GetCountry('FER').GetNameWithNoTooltip] brought this war upon itself, and that we only take back what is rightfully ours. Even the courts that once frowned on our ambitions now concede that our cause is just."
 italy_balance_pad.5.a: "Let the world see the justice of our cause."
 italy_balance_pad.6.title: "Beyond the Apennines"
 italy_balance_pad.6.entry: "$italy_balance_pad.6.title$"
 italy_balance_pad.6.desc: "[ShowLocationName('bologna')] and its countryside are now firmly part of our realm. From its walls, the passes over the Apennines lead straight to [ShowLocationName('florence')] and the riches of Tuscany. Our jurists have prepared the arguments, and our captains await only the order."
 italy_balance_pad.6.a: "Florence will be next."
 italy_balance_pad.7.title: "A New Seat on the Arno"
 italy_balance_pad.7.entry: "$italy_balance_pad.7.title$"
 italy_balance_pad.7.desc: "[ShowLocationName('florence')] and its countryside are now woven into our realm, and peace reigns along our borders. The bankers, guilds and great houses of the Arno hold the wealth of Tuscany, and their tongue is heard ever more often at our court. Our counsellors urge us to move the seat of government to Florence and embrace Tuscan ways, without forgetting the Venetian roots from which our state grew. The Florentine bankers, eager to win our favour, have already opened their coffers to us."
 italy_balance_pad.7.a: "From Florence, we shall lead Italy."
 italy_balance_pad.8.title: "Glory to Padua"
 italy_balance_pad.8.entry: "$italy_balance_pad.8.title$"
 italy_balance_pad.8.desc: "Bells ring out across [ShowLocationName('padova')]. Scholars from all over Christendom crowd the halls of our university, painters come to study Giotto's frescoes in the Scrovegni Chapel, and the great hall of the Palazzo della Ragione is full of petitioners. The city has never been prouder, and our council means to turn this pride into power, at home and among the courts of Italy."
 italy_balance_pad.8.a: "Glory to Padua!"
 italy_balance_pad.9.title: "Cividale for Cadore"
 italy_balance_pad.9.entry: "$italy_balance_pad.9.title$"
 italy_balance_pad.9.desc: "[ShowLocationName('cividale')] is ours, but the old Lombard town, once the seat of the patriarchs, still looks to [GetCountry('AQU').GetNameWithNoTooltip]. Holding it costs us more than it brings. The Patriarch, for his part, holds [ShowLocationName('pieve')] in the high valley of Cadore, whose timber and passes would serve us far better. Our envoys suggest a simple exchange: Cividale for Pieve."
 italy_balance_pad.9.a: "Propose the exchange to the Patriarch."
 italy_balance_pad.9.a.tt: "[GetCountry('AQU').GetNameWithNoTooltip] must choose: give us [ShowLocationName('pieve')] in exchange for [ShowLocationName('cividale')], or lose prestige by refusing."
 italy_balance_pad.10.title: "An Exchange with [GetCountry('PAD').GetNameWithNoTooltip]"
 italy_balance_pad.10.desc: "Envoys from [GetCountry('PAD').GetNameWithNoTooltip] have come to the Patriarch's court. They offer to return [ShowLocationName('cividale')], the ancient seat of our church, if we hand them [ShowLocationName('pieve')] and the valley of Cadore in exchange. Turning down so fair an offer would make us look petty before the courts of Italy."
 italy_balance_pad.10.a: "Cividale must return to the Patriarchate."
 italy_balance_pad.10.b: "We will not trade away Cadore."
 italy_balance_pad.11.title: "The Patriarch Agrees"
 italy_balance_pad.11.desc: "[GetCountry('AQU').GetNameWithNoTooltip] has accepted our offer. [ShowLocationName('cividale')] returns to the Patriarchate, and our banners now fly over [ShowLocationName('pieve')] and the valley of Cadore."
 italy_balance_pad.11.a: "A fair exchange."
 italy_balance_pad.12.title: "The Patriarch Refuses"
 italy_balance_pad.12.desc: "[GetCountry('AQU').GetNameWithNoTooltip] has rejected our offer. The Patriarch's stubbornness has not gone unnoticed, and his standing among the courts of Italy has suffered for it."
 italy_balance_pad.12.a: "So be it."
 italy_balance_flo.1.title: "The Question of Pistoia"
 italy_balance_flo.1.entry: "$italy_balance_flo.1.title$"
 italy_balance_flo.1.desc: "[ShowLocationName('pistoia')] lies barely a day's ride from our walls, and its merchants already live on Florentine credit. Our notaries have unearthed old charters and oaths binding the city to [GetCountry('FLO').GetNameWithNoTooltip]. With peace on both sides of the Apennine foothills, the time has come to put our rights on record, so that they may be pressed when the moment is right."
 italy_balance_flo.1.a: "Pistoia belongs with Florence."
